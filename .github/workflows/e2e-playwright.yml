name: E2E Playwright

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      VISUALSTRUCT_E2E_DIAGNOSTICS: "1"
      VISUALSTRUCT_E2E_DIAGNOSTICS_DIR: e2e-safe-diagnostics

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov playwright

      - name: Install Playwright browsers
        run: |
          python -m playwright install --with-deps chromium firefox

      - name: Run Playwright E2E tests
        run: |
          python -B scripts/run_e2e_diagnostics.py --suite chromium tests/test_ui_playwright_e2e.py

      - name: Run Firefox compatibility smoke tests
        run: |
          python -B scripts/run_e2e_diagnostics.py --suite firefox tests/test_playwright_firefox_smoke.py

      - name: Preserve E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            e2e-safe-diagnostics/*.jsonl
            e2e-safe-diagnostics/*-result.json
          if-no-files-found: warn
          include-hidden-files: false
