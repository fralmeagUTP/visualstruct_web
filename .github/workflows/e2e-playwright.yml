name: E2E Playwright
on:
  workflow_dispatch:
jobs:
  pending-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - group: sorting-specific
            suite: chromium
            target: tests/test_ui_playwright_e2e.py
            cases: "--case test_playwright_sorting_specific_strategy_views_and_zero_axis"
            minutes: 20
          - group: graph-algorithms
            suite: chromium
            target: tests/test_ui_playwright_e2e.py
            cases: "--case test_playwright_graph_execute_completes_algorithms_across_phases"
            minutes: 40
          - group: graph-jpeg
            suite: chromium
            target: tests/test_ui_playwright_e2e.py
            cases: "--case test_playwright_graph_export_jpg_captures_full_canvas_and_result_block"
            minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      VISUALSTRUCT_E2E_DIAGNOSTICS: "1"
      VISUALSTRUCT_E2E_DIAGNOSTICS_DIR: e2e-safe-diagnostics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov playwright
      - name: Install selected Playwright browser
        run: python -m playwright install --with-deps ${{ matrix.suite }}
      - name: Run exact pending cases
        run: python -B scripts/run_e2e_diagnostics.py --suite ${{ matrix.suite }} ${{ matrix.target }} ${{ matrix.cases }}
      - name: Preserve safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics-${{ matrix.group }}
          path: |
            e2e-safe-diagnostics/*.jsonl
            e2e-safe-diagnostics/*-result.json
          if-no-files-found: warn
          include-hidden-files: false
