name: Unit and Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run unit/integration tests
        run: |
          python -m pytest -q tests --ignore=tests/test_ui_playwright_e2e.py

      - name: Run coverage report
        run: |
          python -m pytest --cov=app --cov-report=term-missing --ignore=tests/test_ui_playwright_e2e.py
