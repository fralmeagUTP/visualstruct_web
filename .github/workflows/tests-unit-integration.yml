name: Unit and Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  unit-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Select preinstalled GCC and gcov with condition coverage
        shell: bash
        run: |
          set -euo pipefail
          compiler="$(command -v gcc-14)"
          coverage_tool="$(command -v gcov-14)"
          "$compiler" --version
          "$coverage_tool" --version
          "$compiler" --help=common > "$RUNNER_TEMP/visualstruct-gcc-options.txt"
          grep -q -- '-fcondition-coverage' "$RUNNER_TEMP/visualstruct-gcc-options.txt"
          "$coverage_tool" --help > "$RUNNER_TEMP/visualstruct-gcov-options.txt"
          grep -q -- '--conditions' "$RUNNER_TEMP/visualstruct-gcov-options.txt"
          tools_dir="$RUNNER_TEMP/visualstruct-condition-coverage-tools"
          mkdir -p "$tools_dir"
          ln -s "$compiler" "$tools_dir/gcc"
          ln -s "$coverage_tool" "$tools_dir/gcov"
          echo "$tools_dir" >> "$GITHUB_PATH"

      - name: Run unit/integration tests
        run: |
          python -m pytest -q tests -m "not e2e"

      - name: Run coverage report
        run: |
          python -m pytest -m "not e2e and not performance" --cov=app --cov-report=term-missing --cov-report=json:coverage.json
          python scripts/check_coverage_gates.py --report coverage.json
