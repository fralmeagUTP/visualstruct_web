<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    (function applyDidacticModeEarly() {
      const storageKey = "didactic-mode";
      const allowedModes = { visual: true, full: true };
      let mode = "visual";
      try {
        const storedMode = window.localStorage.getItem(storageKey);
        if (storedMode && allowedModes[storedMode]) {
          mode = storedMode;
        }
      } catch (error) {
        mode = "visual";
      }
      document.documentElement.setAttribute("data-didactic-mode", mode);
    }());
  </script>
  <title>{% block title %}Visualizador Web de Estructuras{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='20260930q') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/contextual_help.css', v='20261027') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/classroom_view.css', v='20261027layout') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/c_syntax_highlight.css', v='20261027a') }}">
</head>
<body>
  {% include '_header.html' %}
  {% include '_navbar.html' %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% include '_footer.html' %}
  <script src="{{ url_for('static', filename='js/interpreter_runtime.js', v='20260930q') }}" defer></script>
  <script src="{{ url_for('static', filename='js/contextual_help.js', v='20261027') }}" defer></script>

  <script src="{{ url_for('static', filename='js/classroom_view.js', v='20261027scroll1') }}" defer></script>
  <script src="{{ url_for('static', filename='js/console-history.js', v='20261027a') }}" defer></script>
  <script src="{{ url_for('static', filename='js/multiple_input.js', v='20261027batch1') }}" defer></script>

  <script src="{{ url_for('static', filename='js/hierarchical.js', v='20261027batch1') }}" defer></script>
  <script src="{{ url_for('static', filename='js/graph_layout.js', v='20261027a') }}" defer></script>

  {% block scripts %}{% endblock %}
</body>
</html>
