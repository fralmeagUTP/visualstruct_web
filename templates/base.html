<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Visualizador Web de Estructuras{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css', v='20260512g') }}">
</head>
<body>
  {% include '_header.html' %}
  {% include '_navbar.html' %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% include '_footer.html' %}
  <script src="{{ url_for('static', filename='js/interpreter_runtime.js', v='20260512g') }}" defer></script>
  <script src="{{ url_for('static', filename='js/sequential.js', v='20260512g') }}" defer></script>
  <script src="{{ url_for('static', filename='js/hierarchical.js', v='20260512g') }}" defer></script>
  <script src="{{ url_for('static', filename='js/graph.js', v='20260512g') }}" defer></script>
  <script src="{{ url_for('static', filename='js/hash.js', v='20260512g') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
