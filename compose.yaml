services:
  visualstruct:
    build:
      context: .
      dockerfile: Dockerfile
    image: visualstruct-web:local
    container_name: visualstruct-web
    ports:
      - "${VISUALSTRUCT_PORT:-5050}:5050"
    environment:
      APP_ENV: production
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Defina FLASK_SECRET_KEY en el archivo .env}
      FLASK_PORT: "5050"
      SESSION_TYPE: cachelib
      SESSION_CACHE_DIR: /var/lib/visualstruct/sessions
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Only for local HTTP testing. Set false behind a real HTTPS proxy.
      ALLOW_INSECURE_COOKIES_IN_PRODUCTION: ${ALLOW_INSECURE_COOKIES_IN_PRODUCTION:-true}
      SESSION_COOKIE_SAMESITE: Lax
      SESSION_LIFETIME_MINUTES: "240"
      SESSION_MAX_HISTORY: "300"
    volumes:
      - visualstruct_sessions:/var/lib/visualstruct/sessions
    restart: unless-stopped

volumes:
  visualstruct_sessions:
